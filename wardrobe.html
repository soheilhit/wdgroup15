<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>کمد من | ست‌یار</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/wardrobe.css">
</head>
<body data-page="wardrobe">
  <header id="site-header"></header>

  <main class="container">
    <div class="page-title">
      <h1>کمد من</h1>
      <p>عکس لباس‌هایت را اضافه کن. بهتر است عکس روی زمینه ساده و بدون شلوغی باشد.</p>
    </div>

    <div class="layout">
      <form id="add-form" class="card form-card" autocomplete="off">
        <h3>افزودن لباس</h3>

        <label class="drop" id="drop" for="file">
          <img id="preview" alt="" hidden>
          <span id="drop-text">برای انتخاب عکس بزن</span>
        </label>
        <input id="file" type="file" accept="image/*" hidden>

        <label class="field">نام
          <input class="input" id="name" type="text" maxlength="40" placeholder="مثلاً مانتو کرم بلند">
        </label>

        <label class="field">دسته
          <select class="input" id="category"></select>
        </label>

        <div class="field">رنگ اصلی
          <div class="swatches" id="colors"></div>
        </div>

        <div class="field">مناسب برای
          <div class="occ" id="occasions"></div>
        </div>

        <button class="btn btn-primary" type="submit" style="width:100%">افزودن به کمد</button>
        <button class="btn btn-soft btn-sm" type="button" id="btn-samples" style="width:100%;margin-top:8px">افزودن لباس نمونه</button>
      </form>

      <section>
        <div class="filters" id="filters"></div>
        <div id="grid" class="grid"></div>
      </section>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/wardrobe.js"></script>
</body>
</html>
